# Fallback when Coolify uses Nixpacks instead of the Dockerfile.
# Prefer Build Pack = Dockerfile (see README). This only installs Chromium for Nixpacks deploys.
providers = ["node"]

[phases.setup]
aptPkgs = [
  "chromium",
  "fonts-liberation",
  "fonts-noto-core",
  "ca-certificates",
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
]

[phases.build]
cmds = ["npm run build", "npx playwright-core install chromium"]

[variables]
CHROMIUM_EXECUTABLE_PATH = "/usr/bin/chromium"
LOCAL_STORAGE_DIR = "/app/.storage"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "0"
